name: Tests

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

env:
  DIR_TESTS: /tmp/tests-bad-server
  REP_TESTS: https://github.com/Yandex-Practicum/tests-bad-server.git
  REPO: ${{ github.event.repository.name }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Get testing lib
        run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS

      - name: Start project
        run: bash $DIR_TESTS/bin/start_project.sh

      - name: Wait backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost/api/auth/csrf-token; then
              echo "Backend ready"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Backend did not start"
          exit 1

      - name: Run tests
        run: bash $DIR_TESTS/bin/run.sh
