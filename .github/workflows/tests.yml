name: Tests

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

env:
  DIR_TESTS: /tmp/tests-bad-server
  REP_TESTS: https://github.com/Yandex-Practicum/tests-bad-server.git
  REPO: ${{ github.event.repository.name }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Get testing lib
        run: |
          set -eu
          git clone --depth 1 $REP_TESTS $DIR_TESTS

      - name: Start project
        run: bash $DIR_TESTS/bin/start_project.sh

      - name: Wait project
        run: |
          sleep 20
          docker compose ps
          docker compose logs --tail=50 backend
          docker compose logs --tail=50 server
          curl -I http://localhost

      - name: Run tests
        run: bash $DIR_TESTS/bin/run.sh

      # Логи ПОСЛЕ тестов: покажут, какие запросы и с какими статусами
      # пришли (nginx) и из-за чего бэкенд отвечал 500 (backend).
      - name: Logs after tests
        if: always()
        run: |
          echo "===== NGINX (запросы и статусы) ====="
          docker compose logs --no-color --tail=300 server
          echo "===== BACKEND ====="
          docker compose logs --no-color --tail=300 backend
